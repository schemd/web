version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, automated, 'area: tooling']
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, automated]
    open-pull-requests-limit: 5
    # Compiler releases have a dedicated, fully verified sync workflow.
    ignore:
      - dependency-name: '@schemd/core'
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
