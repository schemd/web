name: Diagram review

on:
  pull_request:
    paths:
      - '**/*.md'

concurrency:
  group: diagram-review-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: Diagram report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Compare diagram topology
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node scripts/diagram-review.mjs "origin/$BASE_REF" --out=diagram-review.md
          cat diagram-review.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagram-review
          path: diagram-review.md
          retention-days: 7

  comment:
    name: Comment diagram report
    needs: review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      # This job never checks out or executes pull-request code.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: diagram-review
          path: report
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { readFileSync } = require('node:fs');
            const body = readFileSync('report/diagram-review.md', 'utf8');
            const marker = '## Diagram review';
            if (!body.startsWith(marker) || body.length > 60000) {
              throw new Error('Invalid or oversized diagram report.');
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((comment) =>
              comment.user.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
