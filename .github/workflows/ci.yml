name: CI

on:
  push:
  pull_request:

# A branch only needs its newest commit verified; supersede in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # `bun install` is frozen on CI whether or not you ask for it, so a
      # package.json edit committed without its regenerated lockfile fails here
      # with a diagnostic rather than silently resolving a different tree.
      # `bun run ci` reproduces exactly this locally.
      - name: Install dependencies
        run: bun run ci

      # Frozen install proves the lockfile satisfies package.json. It cannot
      # prove the lockfile is what bun would write, so drift that resolves
      # cleanly (a widened range, a removed dependency) would still reach main.
      - name: Verify the lockfile is committed up to date
        run: |
          if ! git diff --quiet -- bun.lock; then
            echo '::error file=bun.lock::bun.lock is out of date. Run `bun install` and commit the result.'
            git --no-pager diff -- bun.lock
            exit 1
          fi

      - run: bun run format:check
      - run: bun run lint
      - run: bun run check
      - run: bun run test:unit

      # Every `schemd` fence in the documentation corpus must compile. The docs
      # pipeline compiles fences per request, so a broken example is a 500 on
      # one page rather than a failed build — this is what turns it back into a
      # build failure.
      - run: bun run test:docs

      - run: bun run build
      - run: bun scripts/check-build-budget.ts

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
