name: Sync compiler release

# Keeps the website in step with @schemd/core without anyone watching npm.
#
# Three things used to be done by hand after every publish, and all three had
# already gone wrong: the dependency range in package.json, the lockfile that
# has to be regenerated with it, and the release snapshot the changelog reads
# offline. This job does all three, runs the full verification suite against
# the result, and opens a pull request. Nothing merges itself — a compiler
# release can change rendered output, and that deserves a human look — but
# nothing has to be typed either.

on:
  schedule:
    # Twice a day, offset from the hour so it does not pile onto npm's peak.
    - cron: '17 6,18 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Pin a specific @schemd/core version instead of npm latest'
        required: false
        type: string

concurrency:
  group: sync-core
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve the target release
        id: target
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            target="${{ inputs.version }}"
          else
            target=$(npm view @schemd/core version)
          fi
          installed=$(node -p "require('./node_modules/@schemd/core/package.json').version" 2>/dev/null || echo "none")
          declared=$(node -p "require('./package.json').dependencies['@schemd/core']")
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "branch=chore/core-$target" >> "$GITHUB_OUTPUT"
          echo "Target v$target · declared $declared · installed $installed"

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # `bun add` writes the dependency range and the lockfile in one step,
      # which is exactly the pair that drifted apart before.
      - name: Adopt the release
        run: bun add @schemd/core@${{ steps.target.outputs.target }}

      - name: Refresh the release snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/sync-release-snapshot.ts

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat
          fi

      # The whole suite, not a smoke test: a compiler release can move rendered
      # geometry, and a green run is what makes the pull request reviewable
      # rather than a guess.
      - name: Verify against the new compiler
        if: steps.diff.outputs.changed == 'true'
        run: |
          bun run format:check
          bun run lint
          bun run check
          bun run test:unit
          bun run build
          bun scripts/check-build-budget.ts

      - name: Install Playwright browsers
        if: steps.diff.outputs.changed == 'true'
        run: bunx playwright install --with-deps chromium

      - name: End-to-end suite
        if: steps.diff.outputs.changed == 'true'
        run: bun run test:e2e

      - name: Open the sync pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ steps.target.outputs.branch }}
          base: main
          commit-message: 'chore: adopt @schemd/core v${{ steps.target.outputs.target }}'
          title: 'chore: adopt @schemd/core v${{ steps.target.outputs.target }}'
          body: |
            Automated by `.github/workflows/sync-core.yml`.

            - `@schemd/core` moved to **v${{ steps.target.outputs.target }}**, with `bun.lock` regenerated alongside it.
            - `src/lib/server/release-snapshot.json` regenerated from npm's packument and the compiler's `CHANGELOG.md`.

            The full verification suite (format, lint, types, unit, build, budgets, end-to-end) passed against this
            compiler before the pull request was opened. Review the rendered output before merging — a compiler
            release is allowed to change geometry, and that is the part CI cannot judge.
          labels: dependencies, automated
          delete-branch: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-playwright-report
          path: playwright-report
          if-no-files-found: ignore
