<!doctype html>
<html lang="%schemd.lang%" data-blueprint="paper">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#ffffff" />
		<link rel="icon" type="image/png" href="/%sveltekit.assets%/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/%sveltekit.assets%/favicon.svg" />
		<link rel="shortcut icon" href="/%sveltekit.assets%/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/%sveltekit.assets%/apple-touch-icon.png" />
		<!--
			WebKit still probes `/apple-touch-icon-precomposed.png` at the site root
			before falling back, which logged a 404 on every cold load. Pointing the
			precomposed relation at the same asset answers the probe without
			shipping a second copy of the image.
		-->
		<link
			rel="apple-touch-icon-precomposed"
			sizes="180x180"
			href="/%sveltekit.assets%/apple-touch-icon.png"
		/>
		<meta name="apple-mobile-web-app-title" content="schemd" />
		<link rel="manifest" href="/%sveltekit.assets%/site.webmanifest" />
		<script nonce="%sveltekit.nonce%">
			/* Apply the print mode before first paint, so nothing flashes: a stored
			   choice first, then the system's colour scheme. */
			try {
				var mode = localStorage.getItem('schemd:blueprint');
				if (mode !== 'paper' && mode !== 'negative') {
					mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'negative' : 'paper';
				}
				document.documentElement.dataset.blueprint = mode;
			} catch (error) {}
		</script>
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
